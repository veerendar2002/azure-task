name: Azure Terraform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: veerudemo-app
  TF_WORKING_DIR: terraform
  APP_WORKING_DIR: app

jobs:

  # ==========================================================
  # STAGE 1 - BUILD
  # ==========================================================

  build:
    name: Stage 1 - Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test --if-present

      # --------------------------------------------------------
      # Create application package
      # IMPORTANT:
      # node_modules is included because Terraform/App Service
      # has SCM_DO_BUILD_DURING_DEPLOYMENT = false
      # --------------------------------------------------------

      - name: Create application package
        working-directory: app
        run: |
          zip -r ../app.zip .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip


  # ==========================================================
  # STAGE 2 - INFRASTRUCTURE DEPLOYMENT
  # ==========================================================

  terraform:
    name: Stage 2 - Infrastructure Deployment

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure Login using GitHub OIDC
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=azure-task.tfstate" \
            -backend-config="use_azuread_auth=true"


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          # GitHub Actions Managed Identity Object ID
          TF_VAR_deployer_principal_id: ${{ secrets.AZURE_PRINCIPAL_ID }}

        run: |
          terraform plan -out=tfplan


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          # GitHub Actions Managed Identity Object ID
          TF_VAR_deployer_principal_id: ${{ secrets.AZURE_PRINCIPAL_ID }}

        run: |
          terraform apply -auto-approve tfplan


  # ==========================================================
  # STAGE 3 - APPLICATION DEPLOYMENT
  # ==========================================================

  deploy:
    name: Stage 3 - Deploy Application

    runs-on: ubuntu-latest

    needs: terraform

    steps:

      # --------------------------------------------------------
      # Download application artifact
      # --------------------------------------------------------

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Deploy application
      # --------------------------------------------------------

      - name: Deploy application to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app.zip